<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ItaPets - Contato</title>
        <link rel="icon" type="image/png" href="../img/favicon.png">

        <link rel="stylesheet" href="../css/estilo.css">
    </head>

    <body>
        <header>
            <h1>
                <a href="../index.html">
                    <picture>
                        <img src="../img/logo-itapets.webp" alt="ItaPets - Seu Mundo Pet" width="150">
                    </picture>
                </a>
            </h1>
            
            <nav>
                <a href="../index.html">Início</a> |
                <a href="../index.html#produtos">Produtos</a>
            </nav>
        </header>

        <main>
            <section id="contato">
                <h2>Fale Conosco</h2>
                
                <form action="mailto:seuemail@exemplo.com?subject=Comentário%20sobre%20o%20site%20ItaPets" method="post" enctype="text/plain">

                    <fieldset>
                        <legend>Dados Pessoais</legend>
                        
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="Nome" required placeholder="Digite seu nome">

                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="E-mail" required placeholder="seuemail@exemplo.com">

                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="Telefone" required placeholder="(79) 99999-9999">
                    </fieldset>

                    <fieldset>
                        <legend>Qual pet você possui?</legend>
                        
                        <input type="radio" id="pet-cao" name="TipoDePet" value="Cão">
                        <label for="pet-cao">Cão</label>

                        <input type="radio" id="pet-gato" name="TipoDePet" value="Gato">
                        <label for="pet-gato">Gato</label>

                        <input type="radio" id="pet-outros" name="TipoDePet" value="Outros">
                        <label for="pet-outros">Outros</label>
                    </fieldset>

                    <fieldset>
                        <legend>Sua Mensagem</legend>

                        <label for="assunto">Assunto da Mensagem:</label>
                        <select id="assunto" name="Assunto">
                            <option value="Dúvida">Dúvida sobre produto</option>
                            <option value="Sugestão">Sugestão</option>
                            <option value="Elogio">Elogio</option>
                            <option value="Reclamação">Reclamação</option>
                        </select>

                        <label for="comentario">Comentário:</label>
                        <textarea id="comentario" name="Comentario" rows="5" cols="40" required placeholder="Escreva aqui seu comentário..."></textarea>
                    </fieldset>

                    <fieldset>
                        <legend>Termos e Preferências</legend>

                        <input type="checkbox" id="newsletter" name="Newsletter" value="Sim" checked>
                        <label for="newsletter">Desejo receber promoções por e-mail</label>

                        <input type="checkbox" id="termos" name="Termos" value="Aceito" required>
                        <label for="termos">Concordo com os termos de uso e privacidade</label>
                    </fieldset>

                    <button type="submit">Enviar Comentário</button>
                    <button type="reset">Limpar Campos</button>

                </form>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 ItaPets - Todos os Direitos Reservados.</p>
        </footer>
    </body>
</html>
